x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.docker.nas}
  AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env.docker.nas}
  NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
  AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}

services:
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["npx", "prisma", "db", "push"]
    restart: "no"
    environment: *app-env

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${APP_PORT:-3000}:3000"
    environment: *app-env
    depends_on:
      bootstrap:
        condition: service_completed_successfully
