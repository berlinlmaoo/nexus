x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.docker.nas}
  AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env.docker.nas}
  NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
  AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}

services:
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.docker.nas}
        AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env.docker.nas}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    command: ["npx", "prisma", "db", "push"]
    restart: "no"
    environment: *app-env

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.docker.nas}
        AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env.docker.nas}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    restart: always
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - task_attachments:/app/public/uploads/attachments
      - project_icons:/app/public/uploads/project-icons
    environment: *app-env
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    restart: always
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARED_TUNNEL_TOKEN:?Set CLOUDFLARED_TUNNEL_TOKEN in .env.docker.nas}
    depends_on:
      app:
        condition: service_started

volumes:
  task_attachments:
  project_icons:
