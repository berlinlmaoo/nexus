name: iOS compile check

# Kenapa ini ada: kode ditulis di OpenChamber (Linux) yang NGGAK BISA compile iOS,
# jadi error baru ketahuan pas dibuka di Mac. Workflow ini yang ngecek tiap push,
# supaya perubahan yang gagal compile ketahuan dalam hitungan menit — bukan setelah
# numpuk 8 commit.
#
# CATATAN BIAYA: runner macOS di repo PRIVATE dihitung 10x menit dibanding Linux.
# Kalau jatah GitHub Actions kamu tipis, ganti `runs-on` ke self-hosted runner di
# Mac sendiri (gratis, unlimited) — lihat README.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate NEXUS.xcodeproj
        # .xcodeproj sengaja nggak di-commit; project.yml sumber kebenarannya.
        run: xcodegen generate

      - name: Compile check
        # Simulator + signing dimatiin: nggak butuh sertifikat/provisioning sama
        # sekali, jadi CI ini jalan tanpa rahasia apa pun. Tujuannya cuma satu —
        # mastiin kodenya compile.
        run: |
          set -o pipefail
          xcodebuild \
            -project NEXUS.xcodeproj \
            -scheme NEXUS-Debug \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Ringkas error
        if: failure()
        run: |
          echo "### Error compile" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" build.log | sort -u | head -40 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Simpan log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
