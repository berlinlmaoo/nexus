<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The <title> and the link-preview tags. People get these as they are and the app sets the tab title per page
      (src/lib/page-title.ts). A link-preview crawler gets this file through nginx SSI (maintenance/phaethon.conf,
      /__og_page): the block below is then left out and the include puts that link's own tags in its place (a
      form's title and description, ...). If the app does not answer, the include falls back to the block.
    -->
    <!--# block name="og_generic" -->
    <title>NEXUS</title>
    <meta name="description" content="NEXUS by Z Networks: tasks, projects, attendance and chat in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NEXUS" />
    <meta property="og:title" content="NEXUS" />
    <meta property="og:description" content="NEXUS by Z Networks: tasks, projects, attendance and chat in one place." />
    <meta name="twitter:card" content="summary" />
    <!--# endblock -->
    <!--# include virtual="/api/og/head?p=$og_path" stub="og_generic" -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("nexus-theme");
          var dark = t === "dark" || (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
