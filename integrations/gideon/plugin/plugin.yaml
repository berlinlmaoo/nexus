name: nexus
version: 0.1.0
description: "NEXUS project/task management tools for GIDEON/PATS. Calls NEXUS service API with a dedicated bearer token."
author: PATS Group
kind: standalone
requires_env:
  - NEXUS_BASE_URL
  - NEXUS_SERVICE_TOKEN
provides_tools:
  # Read
  - nexus_list_projects
  - nexus_list_members
  - nexus_list_tasks
  - nexus_search_tasks
  - nexus_get_project_summary
  - nexus_list_custom_fields
  # Write, scoped to the acting user by x-gideon-actor
  - nexus_create_task
  - nexus_update_task
  - nexus_add_task_comment
  - nexus_create_document
  # Write, added 18 Oct 2026: delete a task — always a card the person confirms (restorable from the Audit)
  - nexus_delete_task
  # Read, added 12 Oct 2026 (sources/citations in the NEXUS chat)
  - nexus_get_task
  - nexus_search_docs
  - nexus_get_doc
  # Read, added 16 Oct 2026: the Master Calendar and Room Booking, as the asking user sees them
  - nexus_get_calendar
  - nexus_list_room_bookings
  # Write, added 16 Oct 2026: book a room as the asking user (approval modes like create_task)
  - nexus_book_room
  # Write, added 16 Oct 2026: move / cancel an existing booking as the asking user (same approval modes)
  - nexus_move_room_booking
  - nexus_cancel_room_booking
  - nexus_search_workspace
  # Read, added 18 Oct 2026: Pipeline deals and Legal documents (loaded on demand)
  - nexus_search_deals
  - nexus_search_legal_documents
  # Added 18 Oct 2026 (owner-approved package, schemas_extra.py): inbox, chat, reminders
  - nexus_get_my_inbox
  - nexus_list_conversations
  - nexus_read_conversation
  - nexus_send_message
  - nexus_create_reminder
  - nexus_list_reminders
  - nexus_cancel_reminder
  # Leave (18 Oct 2026): own balance, file a day off / annual leave / public holiday, approvers decide — always a
  # card, applied through the Attendance endpoints as the person (their rules, the approval resolver). Sick and izin
  # need a photo: the form, not chat. NOT gated by NEXUS_GIDEON_NO_ATTENDANCE (that flag is only the ticket tools).
  - nexus_get_leave_balance
  - nexus_submit_leave_request
  - nexus_decide_attendance_request
  # Bulk task work (18 Oct 2026): one card for many task changes; subtasks
  - nexus_bulk_update_tasks
  - nexus_add_subtasks
  # Pipeline, Outlet Sales, Social Media Report (18 Oct 2026): always a card, the dashboards' own endpoints
  - nexus_move_deal_stage
  - nexus_add_payment_term
  - nexus_log_outlet_sales
  - nexus_log_social_media_day
  # Legal draft (never finalised/signed), Z Vault search + share link, announcements (BoD) — always a card
  - nexus_create_legal_draft
  - nexus_search_vault
  - nexus_create_vault_share_link
  - nexus_draft_announcement
  # Spreadsheets (read, edit cells, create), pictures stored in NEXUS (→ vision_analyze), files (PDF/DOCX/XLSX
  # into the chat; saving to Z Vault is a card)
  - nexus_search_sheets
  - nexus_get_sheet
  - nexus_edit_sheet_cells
  - nexus_create_sheet
  - nexus_read_nexus_image
  - nexus_export_file
  - nexus_save_file_to_vault
  # Attendance: read one's OWN day, and PROPOSE one of two remedies on a ticket. Nothing here applies
  # anything — both proposals wait on a BoD tap at POST /api/complaints/[id]/correction.
  - nexus_get_attendance_day
  - nexus_propose_attendance_correction
  - nexus_propose_penalty_cancellation
  - nexus_resolve_ticket
  # The four tools above are NOT registered when NEXUS_GIDEON_NO_ATTENDANCE=1 (the dev instance).
  # Deliberately absent, and must stay absent: anything that APPLIES a change to attendance, shifts or
  # day-off quota. Every other tool is safe because it acts AS the user and is refused wherever they
  # would be — but a person MAY check themselves in, so acting as them is no guard there at all. That
  # is why the two attendance tools above only ever write a proposal.
