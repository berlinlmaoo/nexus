# Drop-in for the GIDEON shim unit, 18 Oct 2026 (owner-approved): graceful restart.
#   prod: /etc/systemd/system/gideon-shim.service.d/graceful-restart.conf      (paths below)
#   dev:  /etc/systemd/system/gideon-dev-shim.service.d/graceful-restart.conf  (same, with ~/gideon-dev)
# then: sudo systemctl daemon-reload
# gideon-shim-graceful.js is preloaded (a separate file, so edits to the shim never drop it): on SIGTERM the
# answers in flight finish (hosted tiers up to GIDEON_DRAIN_MS = 120 s after the signal, Model 0 up to 425 s),
# new requests get 503 {"error":"shim_restarting"} + Retry-After, and node exits when the last one is done.
# KillMode=mixed: SIGTERM goes to node only, so the Hermes / runner children are not killed under it; whatever
# is left once node exits is SIGKILLed by systemd. TimeoutStopSec sits above the longest cap.
# A restart now waits for the answers in flight (seconds usually; up to ~2 min, ~7 min with Model 0 busy).
# Undo: remove the file, daemon-reload, restart.
[Service]
KillMode=mixed
TimeoutStopSec=460
ExecStart=
ExecStart=/usr/bin/node --require /home/debian/gideon/gideon-shim-graceful.js /home/debian/gideon/codex-oracle-shim.js
