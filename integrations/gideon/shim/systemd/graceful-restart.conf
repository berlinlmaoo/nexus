# Drop-in for gideon-shim.service (prod) and gideon-dev-shim.service (dev), 18 Oct 2026 (owner-approved).
# Install: sudo install -D -m 0644 graceful-restart.conf /etc/systemd/system/<unit>.service.d/graceful-restart.conf
#          sudo systemctl daemon-reload
# The shim drains on SIGTERM: answers in flight finish (hosted tiers up to GIDEON_DRAIN_MS = 120 s after the
# signal, Model 0 up to its own 420 s timeout), new requests get 503 {"error":"shim_restarting"} + Retry-After.
# KillMode=mixed: SIGTERM goes to node only, so the Hermes / runner children are not killed under it; whatever
# is left once node exits is SIGKILLed by systemd. TimeoutStopSec sits above the longest cap.
# A restart now waits for the answers in flight (up to ~2 min, ~7 min with Model 0 busy).
# Undo: remove the file, daemon-reload.
[Service]
KillMode=mixed
TimeoutStopSec=460
