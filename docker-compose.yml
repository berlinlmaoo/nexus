services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: nexus_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://nexus_user:password123@db:5432/nexus_db?schema=public"
      AUTH_SECRET: "83917d299c83455a82d226f4a0f3b0f677e3a8abf210d297baae0d95d4ddd0a0" # Same as local .env
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "83917d299c83455a82d226f4a0f3b0f677e3a8abf210d297baae0d95d4ddd0a0"
    depends_on:
      - db

volumes:
  db_data:
