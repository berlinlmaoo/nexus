x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:-postgresql://nexus_user:password123@db:5432/nexus_db?schema=public}
  AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env.docker}
  NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
  AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-nexus_user} -d ${POSTGRES_DB:-nexus_db}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql/data

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["npx", "prisma", "db", "push"]
    restart: "no"
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${APP_PORT:-3000}:3000"
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

volumes:
  db_data:
