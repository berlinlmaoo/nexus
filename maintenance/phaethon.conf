# nexus.patsgroup.id → Phaëthon (production).
# Serves the built SPA (dist/) statically + proxies /api & /auth to the backend (:3002).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3000 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1024m;

    # NOTE: HTTP→HTTPS is enforced at the Cloudflare edge ("Always Use HTTPS", enabled 2026-06-17 after
    # staff on http:// hit "Akses lokasi ditolak" — geolocation needs a secure context). An origin-side
    # redirect is NOT possible here: cloudflared doesn't pass the real client scheme (neither
    # X-Forwarded-Proto nor CF-Visitor survive the tunnel), so the edge toggle is the only lever.

    # Large file downloads/previews — stream straight through (no temp-file buffering → fast first byte,
    # low disk/RAM). `^~` beats the generic /api regex below so it wins for this prefix.
    location ^~ /api/files/ {
        proxy_pass http://host.docker.internal:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }

    # Chunked uploads — stream the request body to the app instead of spooling each 80MB chunk to a
    # temp file first (faster uploads, less disk churn).
    location ^~ /api/attachments/chunk {
        proxy_pass http://host.docker.internal:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # Streamed downloads from the app (NAS, Drive, project files) — bypass response buffering like the
    # /api/files/ block above, so big deliverables start immediately instead of spooling to a temp file.
    # This regex must sit BEFORE the generic /api regex (first-matching regex wins).
    location ~ ^/api/(nas/download|drive/download|projects/[^/]+/files/download) {
        proxy_pass http://host.docker.internal:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }

    # API + NextAuth → Phaëthon backend (host :3002)
    location ~ ^/(api|auth)(/|$) {
        proxy_pass http://host.docker.internal:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # OAuth 2.1 discovery metadata for the MCP connector → backend meta routes (RFC 9728 / RFC 8414).
    location = /.well-known/oauth-protected-resource {
        proxy_pass http://host.docker.internal:3002/api/mcp/oauth/meta/protected-resource;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://host.docker.internal:3002/api/mcp/oauth/meta/authorization-server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
    # Any other discovery probe (e.g. openid-configuration) → clean 404, not the SPA's 200 HTML.
    location /.well-known/ {
        return 404;
    }

    # Hashed build assets — immutable long cache.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — every other path serves index.html (no-store so new builds load).
    # Frame-deny everything (esp. the /oauth/authorize consent page) to block clickjacking.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}
