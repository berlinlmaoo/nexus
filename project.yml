# XcodeGen spec — regenerate the Xcode project anytime with:  xcodegen generate
# (run from apps/nexus-ios). The .xcodeproj is NOT committed; this file is the source of truth.
name: NEXUS
options:
  bundleIdPrefix: id.znetworks
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Versi yang dilihat orang di TestFlight/App Store. Naikin kalau isinya berubah berarti.
    MARKETING_VERSION: "0.1.3"
    # WAJIB NAIK TIAP UPLOAD ke App Store Connect. Apple nolak build number yang sudah pernah
    # dipakai untuk MARKETING_VERSION yang sama, dan errornya baru muncul setelah upload selesai.
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.0"            # Swift 5 language mode — smoother first build (no strict-concurrency friction)
    CODE_SIGN_STYLE: Automatic
    # Team ID Apple (10 karakter). Sengaja ditaruh di sini, BUKAN di GUI Xcode: .xcodeproj tidak
    # di-commit dan ditimpa tiap `xcodegen generate`, jadi Team yang di-set lewat GUI hilang tiap
    # ganti branch. Cari punyamu: Xcode → Settings → Accounts, atau Build Settings → DEVELOPMENT_TEAM.
    # Team ID bukan rahasia — dia ikut ke setiap app yang didistribusikan.
    DEVELOPMENT_TEAM: "5YR5T42G97"

targets:
  NEXUS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        # Info.plist is pointed at by INFOPLIST_FILE below; it must NOT also be copied as a
        # resource, or the build fails on a duplicate Info.plist.
        excludes:
          - Info.plist
    dependencies:
      # Embeds the widget extension into the app. platformFilter keeps it OUT of the Mac Catalyst
      # build: ActivityKit does not exist on macOS, so a Mac archive that tries to embed this fails
      # while complaining about something else entirely.
      - target: NEXUSWidgets
        platformFilter: iOS
    settings:
      base:
        # USE the committed plist — do not let XcodeGen generate one.
        #
        # This was `info: { path: Sources/Info.plist }`, which reads like "use this file" but means
        # "GENERATE a file here". Every `xcodegen generate` overwrote the handcrafted plist with a
        # minimal one, silently dropping UILaunchScreen — and an iOS app with no launch screen is
        # run in compatibility mode: letterboxed with black bars, floating tab bar over content.
        # It also dropped CFBundleDisplayName and the camera/location/photo usage strings, which
        # would have crashed attendance the first time it asked for the camera.
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: id.znetworks.nexus
        PRODUCT_NAME: NEXUS
        # Associated Domains (passkeys) live in BOTH entitlement files: this one for iOS/iPadOS,
        # and NEXUS-Catalyst.entitlements below for Mac. Entitlements do NOT merge across the two,
        # so `webcredentials:nexus.znetworks.id` has to be written in each of them - otherwise
        # passkeys work on one platform and fail on the other with a generic "not handled" error.
        CODE_SIGN_ENTITLEMENTS: NEXUS.entitlements
        # Mac Catalyst: the same code, built as a Mac app.
        #
        # The Mac needs its own entitlements file and cannot share the iOS one. The Mac App Store
        # requires the app sandbox, and the com.apple.security.* keys that open it back up again
        # are macOS-only - an iOS build carrying an unrecognised entitlement fails provisioning
        # rather than ignoring it. The bracketed key below is a conditional build setting: it
        # applies only when the SDK is macOS, and the plain key above still covers iOS and iPadOS.
        SUPPORTS_MACCATALYST: YES
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: NEXUS-Catalyst.entitlements
        # Keep one bundle identifier across all three platforms. Left to itself Xcode invents a
        # "maccatalyst." prefixed one, which would be a different app to App Store Connect, to the
        # push service, and to every device already carrying a token.
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 1,2 = iPhone + iPad. This MUST live on the target, not on the project above: XcodeGen's
        # built-in setting presets write TARGETED_DEVICE_FAMILY = "1,2" onto every iOS application
        # target, and a target setting always beats a project one - so a project-level value here
        # is silently overridden and the app ships universal anyway.
        #
        # Universal is what App Store validation rejects (error 90474): an iPad-capable app must
        # list all four orientations for multitasking, while Info.plist deliberately locks this app
        # to portrait. Every screen is designed for a phone, so supporting iPad landscape means
        # rebuilding all of them - and universal also demands its own set of iPad screenshots if
        # this ever goes to the App Store. The app still installs on iPad, in an iPhone-sized window.
        TARGETED_DEVICE_FAMILY: "1,2"

  # Live Activities (Dynamic Island + Lock Screen). iOS only, by construction.
  NEXUSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - Info.plist
      # Compiled into BOTH targets on purpose: ActivityKit hands ContentState across the process
      # boundary, so the app and the extension have to agree on the declaration exactly.
      - path: Sources/Shared
    settings:
      base:
        INFOPLIST_FILE: Widgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: id.znetworks.nexus.widgets
        PRODUCT_NAME: NEXUSWidgets
        # An extension is delivered inside the app, never installed on its own.
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"

# Default scheme runs RELEASE so a plain ⌘R is the optimized, smooth-on-device build
# (Debug SwiftUI is dramatically slower on device — the usual cause of on-device lag).
#   • NEXUS       → Release (-O; default ⌘R — the build to actually use on the phone)
#   • NEXUS-Debug → Debug (use only when you need breakpoints / fast incremental builds)
schemes:
  NEXUS:
    build:
      targets:
        NEXUS: all
    run:
      config: Release
    archive:
      config: Release
  NEXUS-Debug:
    build:
      targets:
        NEXUS: all
    run:
      config: Debug
    archive:
      config: Release
