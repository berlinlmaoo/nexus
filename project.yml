# XcodeGen spec — regenerate the Xcode project anytime with:  xcodegen generate
# (run from apps/nexus-ios). The .xcodeproj is NOT committed; this file is the source of truth.
name: NEXUS
options:
  bundleIdPrefix: id.patsgroup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Versi yang dilihat orang di TestFlight/App Store. Naikin kalau isinya berubah berarti.
    MARKETING_VERSION: "0.1.0"
    # WAJIB NAIK TIAP UPLOAD ke App Store Connect. Apple nolak build number yang sudah pernah
    # dipakai untuk MARKETING_VERSION yang sama, dan errornya baru muncul setelah upload selesai.
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"            # Swift 5 language mode — smoother first build (no strict-concurrency friction)
    CODE_SIGN_STYLE: Automatic
    # Team ID Apple (10 karakter). Sengaja ditaruh di sini, BUKAN di GUI Xcode: .xcodeproj tidak
    # di-commit dan ditimpa tiap `xcodegen generate`, jadi Team yang di-set lewat GUI hilang tiap
    # ganti branch. Cari punyamu: Xcode → Settings → Accounts, atau Build Settings → DEVELOPMENT_TEAM.
    # Team ID bukan rahasia — dia ikut ke setiap app yang didistribusikan.
    DEVELOPMENT_TEAM: "5YR5T42G97"
    GENERATE_INFOPLIST_FILE: YES
    # Jawaban export-compliance, dijawab sekali di sini supaya App Store Connect tidak menanyakannya
    # tiap upload (build "Missing Compliance" tidak bisa dibagikan ke tester sampai dijawab).
    # NO itu benar untuk app ini: HTTPS/TLS standar termasuk pengecualian yang dibebaskan.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    # Permission strings (attendance selfie + geofence + receipt photos) — embedded into Info.plist:
    INFOPLIST_KEY_NSCameraUsageDescription: "NEXUS butuh kamera buat selfie absensi."
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "NEXUS butuh lokasi buat verifikasi absen di area kantor."
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "NEXUS butuh galeri buat lampirin nota/foto pengeluaran."
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault

targets:
  NEXUS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.patsgroup.nexus
        PRODUCT_NAME: NEXUS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

# Default scheme runs RELEASE so a plain ⌘R is the optimized, smooth-on-device build
# (Debug SwiftUI is dramatically slower on device — the usual cause of on-device lag).
#   • NEXUS       → Release (-O; default ⌘R — the build to actually use on the phone)
#   • NEXUS-Debug → Debug (use only when you need breakpoints / fast incremental builds)
schemes:
  NEXUS:
    build:
      targets:
        NEXUS: all
    run:
      config: Release
    archive:
      config: Release
  NEXUS-Debug:
    build:
      targets:
        NEXUS: all
    run:
      config: Debug
    archive:
      config: Release
